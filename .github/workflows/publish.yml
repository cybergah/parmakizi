name: Publish to PyPI

# Runs when a GitHub Release is published.
# Uses PyPI "trusted publishing": no password or API token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match the package version
        run: |
          V=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('parmakizi/__init__.py').read()).group(1))")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$V"
            exit 1
          fi

      - name: Run the tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests

      - name: Build and check the package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parmakizi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
